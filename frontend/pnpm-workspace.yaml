packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# pnpm 12 fails the install on any build script not listed here.
allowBuilds:
  # Verifies its platform binary; Storybook's builder depends on it.
  esbuild: true
  # napi-postinstall only re-checks the prebuilt binding pnpm already installed.
  unrs-resolver: false
  # next-intl deps that ship prebuilt binaries; their scripts only verify them.
  "@parcel/watcher": false
  "@swc/core": false
  # The OTLP gRPC exporters' dependency; its script only warns about a dependent's version scheme.
  protobufjs: false

minimumReleaseAgeExclude:
  - prettier@3.9.10
  - lucide-react@1.55.0
  - "@better-auth/core@1.7.12"
  - "@better-auth/drizzle-adapter@1.7.12"
  - "@better-auth/kysely-adapter@1.7.12"
  - "@better-auth/memory-adapter@1.7.12"
  - "@better-auth/mongo-adapter@1.7.12"
  - "@better-auth/prisma-adapter@1.7.12"
  - "@better-auth/telemetry@1.7.12"
  - better-auth@1.7.12

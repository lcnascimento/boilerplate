# Backend dependencies every stack runs, TILT_STACK=minimal included.
# Observability lives in docker-compose.observability.yml.
services:
  # One Postgres shared by every service: each service owns a database and a
  # role named after it, created by its `make db.setup`. To wipe every
  # database, remove the postgres_data volume.
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep the data under /var/lib/postgresql/<major>.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - boilerplate

volumes:
  postgres_data:

networks:
  boilerplate:
    driver: bridge
    name: boilerplate

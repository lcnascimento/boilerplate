services:
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep the data under /var/lib/postgresql/<major>.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - boilerplate

volumes:
  postgres_data:

networks:
  boilerplate:
    driver: bridge
    name: boilerplate

    - type: tests
      code: |-
        test("is healthy", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().message).to.equal("healthy");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

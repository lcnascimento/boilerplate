info:
  name: Get after Delete
  type: http
  seq: 5

http:
  method: GET
  url: "{{NOTES_HOST}}/notes/v1/notes/:id"
  params:
    - name: id
      value: "{{noteId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("the deleted note is gone", function () {
          expect(res.getStatus()).to.equal(404);
          expect(res.getBody().code).to.equal("NOTE_NOT_FOUND");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

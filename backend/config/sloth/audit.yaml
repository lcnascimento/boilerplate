version: prometheus/v1
service: audit
slo_plugins:
  chain:
    - id: sloth.dev/core/sli_rules/v1
      config:
        disableOptimized: true
slos:
  - name: consumer-success
    objective: 99.9
    description: Tentativas de processamento de mensagens de audit-consumer que terminam sem erro.
    labels:
      service: audit-consumer
    sli:
      events:
        error_query: sum(rate(messaging_process_duration_seconds_count{job="boilerplate/audit-consumer",error_type!=""}[{{.window}}])) or vector(0)
        total_query: sum(rate(messaging_process_duration_seconds_count{job="boilerplate/audit-consumer"}[{{.window}}]))
    alerting:
      name: SLOBurnRate
      labels:
        service: audit-consumer
        sloth_slo: consumer-success
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-audit
        description: Tentativas de processamento de mensagens de audit-consumer que terminam sem erro. No ritmo atual, o error budget de 30 dias acaba antes do fim da janela. Veja primeiro no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de audit-consumer.
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
        summary: 'SLO consumer-success de audit-consumer queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta ({{ $labels.sloth_severity }})'
        title: SLO consumer-success de audit-consumer queimando o error budget rápido demais
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
  - name: consumer-latency
    objective: 99
    description: Tentativas de processamento de mensagens de audit-consumer que terminam em até 1s.
    labels:
      service: audit-consumer
    sli:
      events:
        error_query: sum(rate(messaging_process_duration_seconds_count{job="boilerplate/audit-consumer"}[{{.window}}])) - sum(rate(messaging_process_duration_seconds_bucket{job="boilerplate/audit-consumer",le="1"}[{{.window}}]))
        total_query: sum(rate(messaging_process_duration_seconds_count{job="boilerplate/audit-consumer"}[{{.window}}]))
    alerting:
      name: SLOBurnRate
      labels:
        service: audit-consumer
        sloth_slo: consumer-latency
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-audit
        description: Tentativas de processamento de mensagens de audit-consumer que terminam em até 1s. No ritmo atual, o error budget de 30 dias acaba antes do fim da janela. Veja primeiro no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de audit-consumer.
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
        summary: 'SLO consumer-latency de audit-consumer queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta ({{ $labels.sloth_severity }})'
        title: SLO consumer-latency de audit-consumer queimando o error budget rápido demais
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

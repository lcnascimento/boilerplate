version: prometheus/v1
service: notes
slo_plugins:
  chain:
    - id: sloth.dev/core/sli_rules/v1
      config:
        disableOptimized: true
slos:
  - name: api-availability
    objective: 99.9
    description: Requisições HTTP de notes-api-frontend respondidas sem 5xx, fora as de health e readiness.
    labels:
      service: notes-api-frontend
    sli:
      events:
        error_query: sum(rate(http_server_request_total{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health",http_response_status_code=~"5.."}[{{.window}}]))
        total_query: sum(rate(http_server_request_total{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health"}[{{.window}}]))
    alerting:
      name: SLOBurnRate
      labels:
        service: notes-api-frontend
        sloth_slo: api-availability
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-notes
        description: Requisições HTTP de notes-api-frontend respondidas sem 5xx, fora as de health e readiness. No ritmo atual, o error budget de 30 dias acaba antes do fim da janela. Veja primeiro no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-api-frontend.
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
        summary: 'SLO api-availability de notes-api-frontend queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta ({{ $labels.sloth_severity }})'
        title: SLO api-availability de notes-api-frontend queimando o error budget rápido demais
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
  - name: api-latency
    objective: 99
    description: Requisições HTTP de notes-api-frontend respondidas em até 250ms, fora as de health e readiness.
    labels:
      service: notes-api-frontend
    sli:
      events:
        error_query: sum(rate(http_server_request_duration_seconds_count{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health"}[{{.window}}])) - sum(rate(http_server_request_duration_seconds_bucket{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health",le="0.25"}[{{.window}}]))
        total_query: sum(rate(http_server_request_duration_seconds_count{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health"}[{{.window}}]))
    alerting:
      name: SLOBurnRate
      labels:
        service: notes-api-frontend
        sloth_slo: api-latency
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-notes
        description: Requisições HTTP de notes-api-frontend respondidas em até 250ms, fora as de health e readiness. No ritmo atual, o error budget de 30 dias acaba antes do fim da janela. Veja primeiro no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-api-frontend.
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
        summary: 'SLO api-latency de notes-api-frontend queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta ({{ $labels.sloth_severity }})'
        title: SLO api-latency de notes-api-frontend queimando o error budget rápido demais
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
  - name: outbox-freshness
    objective: 99
    description: Minutos em que a mensagem pendente mais antiga do outbox de notes tem até 30s, segundo notes-worker-forwarder.
    labels:
      service: notes-worker-forwarder
    sli:
      raw:
        error_ratio_query: avg_over_time((max(notes_outbox_oldest_pending_age_seconds{job="boilerplate/notes-worker-forwarder"}) > bool 30)[{{.window}}:1m])
    alerting:
      name: SLOBurnRate
      labels:
        service: notes-worker-forwarder
        sloth_slo: outbox-freshness
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-notes
        description: Minutos em que a mensagem pendente mais antiga do outbox de notes tem até 30s, segundo notes-worker-forwarder. No ritmo atual, o error budget de 30 dias acaba antes do fim da janela. Veja primeiro no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-worker-forwarder.
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
        summary: 'SLO outbox-freshness de notes-worker-forwarder queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta ({{ $labels.sloth_severity }})'
        title: SLO outbox-freshness de notes-worker-forwarder queimando o error budget rápido demais
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

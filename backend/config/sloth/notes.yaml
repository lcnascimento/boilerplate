version: prometheus/v1
service: notes
slo_plugins:
  chain:
    - id: sloth.dev/core/sli_rules/v1
      config:
        disableOptimized: true
slos:
  - name: api-availability
    objective: 99.9
    description: Requisições HTTP de notes-api-frontend respondidas sem 5xx, fora as de health e readiness.
    labels:
      service: notes-api-frontend
    sli:
      events:
        error_query: sum(rate(http_server_request_total{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health",http_response_status_code=~"5.."}[{{.window}}])) or vector(0)
        total_query: sum(rate(http_server_request_total{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health"}[{{.window}}]))
    alerting:
      name: SLOBurnRate
      labels:
        service: notes-api-frontend
        sloth_slo: api-availability
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-notes
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
      page_alert:
        labels:
          severity: critical
        annotations:
          description: 'Requisições HTTP de notes-api-frontend respondidas sem 5xx, fora as de health e readiness. Incidente em andamento: a 14,4x ou 6x o ritmo sustentável, o error budget de 30 dias acaba em 2 a 5 dias. Aja agora: veja no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-api-frontend.'
          summary: 'SLO api-availability de notes-api-frontend queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta (5m ou 30m)'
          title: SLO api-availability de notes-api-frontend queimando o error budget rápido demais
      ticket_alert:
        labels:
          severity: warning
        annotations:
          description: 'Requisições HTTP de notes-api-frontend respondidas sem 5xx, fora as de health e readiness. Consumo sustentado de 3x ou 1x o ritmo sustentável: mantido, o error budget de 30 dias se esgota antes do fim da janela. Sem urgência: investigue em horário comercial, pelo dashboard do serviço (qual SLI piorou e desde quando) e depois pelos logs de erro de notes-api-frontend.'
          summary: 'SLO api-availability de notes-api-frontend consumindo o error budget acima do ritmo sustentável: {{ $value | humanizePercentage }} de eventos ruins na janela curta (2h ou 6h)'
          title: SLO api-availability de notes-api-frontend consumindo o error budget acima do ritmo sustentável
  - name: api-latency
    objective: 99
    description: Requisições HTTP de notes-api-frontend respondidas em até 250ms, fora as de health e readiness.
    labels:
      service: notes-api-frontend
    sli:
      events:
        error_query: sum(rate(http_server_request_duration_seconds_count{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health"}[{{.window}}])) - sum(rate(http_server_request_duration_seconds_bucket{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health",le="0.25"}[{{.window}}]))
        total_query: sum(rate(http_server_request_duration_seconds_count{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health"}[{{.window}}]))
    alerting:
      name: SLOBurnRate
      labels:
        service: notes-api-frontend
        sloth_slo: api-latency
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-notes
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
      page_alert:
        labels:
          severity: critical
        annotations:
          description: 'Requisições HTTP de notes-api-frontend respondidas em até 250ms, fora as de health e readiness. Incidente em andamento: a 14,4x ou 6x o ritmo sustentável, o error budget de 30 dias acaba em 2 a 5 dias. Aja agora: veja no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-api-frontend.'
          summary: 'SLO api-latency de notes-api-frontend queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta (5m ou 30m)'
          title: SLO api-latency de notes-api-frontend queimando o error budget rápido demais
      ticket_alert:
        labels:
          severity: warning
        annotations:
          description: 'Requisições HTTP de notes-api-frontend respondidas em até 250ms, fora as de health e readiness. Consumo sustentado de 3x ou 1x o ritmo sustentável: mantido, o error budget de 30 dias se esgota antes do fim da janela. Sem urgência: investigue em horário comercial, pelo dashboard do serviço (qual SLI piorou e desde quando) e depois pelos logs de erro de notes-api-frontend.'
          summary: 'SLO api-latency de notes-api-frontend consumindo o error budget acima do ritmo sustentável: {{ $value | humanizePercentage }} de eventos ruins na janela curta (2h ou 6h)'
          title: SLO api-latency de notes-api-frontend consumindo o error budget acima do ritmo sustentável
  - name: outbox-freshness
    objective: 99
    description: Minutos em que a mensagem pendente mais antiga do outbox de notes tem até 30s, segundo notes-worker-forwarder.
    labels:
      service: notes-worker-forwarder
    sli:
      raw:
        error_ratio_query: avg_over_time((max(notes_outbox_oldest_pending_age_seconds{job="boilerplate/notes-worker-forwarder"}) > bool 30)[{{.window}}:1m])
    alerting:
      name: SLOBurnRate
      labels:
        service: notes-worker-forwarder
        sloth_slo: outbox-freshness
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-notes
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
      page_alert:
        labels:
          severity: critical
        annotations:
          description: 'Minutos em que a mensagem pendente mais antiga do outbox de notes tem até 30s, segundo notes-worker-forwarder. Incidente em andamento: a 14,4x ou 6x o ritmo sustentável, o error budget de 30 dias acaba em 2 a 5 dias. Aja agora: veja no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-worker-forwarder.'
          summary: 'SLO outbox-freshness de notes-worker-forwarder queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta (5m ou 30m)'
          title: SLO outbox-freshness de notes-worker-forwarder queimando o error budget rápido demais
      ticket_alert:
        labels:
          severity: warning
        annotations:
          description: 'Minutos em que a mensagem pendente mais antiga do outbox de notes tem até 30s, segundo notes-worker-forwarder. Consumo sustentado de 3x ou 1x o ritmo sustentável: mantido, o error budget de 30 dias se esgota antes do fim da janela. Sem urgência: investigue em horário comercial, pelo dashboard do serviço (qual SLI piorou e desde quando) e depois pelos logs de erro de notes-worker-forwarder.'
          summary: 'SLO outbox-freshness de notes-worker-forwarder consumindo o error budget acima do ritmo sustentável: {{ $value | humanizePercentage }} de eventos ruins na janela curta (2h ou 6h)'
          title: SLO outbox-freshness de notes-worker-forwarder consumindo o error budget acima do ritmo sustentável
  - name: consumer-success
    objective: 99.9
    description: Tentativas de processamento de mensagens de notes-consumer que terminam sem erro.
    labels:
      service: notes-consumer
    sli:
      events:
        error_query: sum(rate(messaging_process_duration_seconds_count{job="boilerplate/notes-consumer",error_type!=""}[{{.window}}])) or vector(0)
        total_query: sum(rate(messaging_process_duration_seconds_count{job="boilerplate/notes-consumer"}[{{.window}}]))
    alerting:
      name: SLOBurnRate
      labels:
        service: notes-consumer
        sloth_slo: consumer-success
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-notes
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
      page_alert:
        labels:
          severity: critical
        annotations:
          description: 'Tentativas de processamento de mensagens de notes-consumer que terminam sem erro. Incidente em andamento: a 14,4x ou 6x o ritmo sustentável, o error budget de 30 dias acaba em 2 a 5 dias. Aja agora: veja no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-consumer.'
          summary: 'SLO consumer-success de notes-consumer queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta (5m ou 30m)'
          title: SLO consumer-success de notes-consumer queimando o error budget rápido demais
      ticket_alert:
        labels:
          severity: warning
        annotations:
          description: 'Tentativas de processamento de mensagens de notes-consumer que terminam sem erro. Consumo sustentado de 3x ou 1x o ritmo sustentável: mantido, o error budget de 30 dias se esgota antes do fim da janela. Sem urgência: investigue em horário comercial, pelo dashboard do serviço (qual SLI piorou e desde quando) e depois pelos logs de erro de notes-consumer.'
          summary: 'SLO consumer-success de notes-consumer consumindo o error budget acima do ritmo sustentável: {{ $value | humanizePercentage }} de eventos ruins na janela curta (2h ou 6h)'
          title: SLO consumer-success de notes-consumer consumindo o error budget acima do ritmo sustentável
  - name: consumer-latency
    objective: 99
    description: Tentativas de processamento de mensagens de notes-consumer que terminam em até 1s.
    labels:
      service: notes-consumer
    sli:
      events:
        error_query: sum(rate(messaging_process_duration_seconds_count{job="boilerplate/notes-consumer"}[{{.window}}])) - sum(rate(messaging_process_duration_seconds_bucket{job="boilerplate/notes-consumer",le="1"}[{{.window}}]))
        total_query: sum(rate(messaging_process_duration_seconds_count{job="boilerplate/notes-consumer"}[{{.window}}]))
    alerting:
      name: SLOBurnRate
      labels:
        service: notes-consumer
        sloth_slo: consumer-latency
      annotations:
        dashboard_url: http://localhost:3010/d/boilerplate-notes
        runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
      page_alert:
        labels:
          severity: critical
        annotations:
          description: 'Tentativas de processamento de mensagens de notes-consumer que terminam em até 1s. Incidente em andamento: a 14,4x ou 6x o ritmo sustentável, o error budget de 30 dias acaba em 2 a 5 dias. Aja agora: veja no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-consumer.'
          summary: 'SLO consumer-latency de notes-consumer queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta (5m ou 30m)'
          title: SLO consumer-latency de notes-consumer queimando o error budget rápido demais
      ticket_alert:
        labels:
          severity: warning
        annotations:
          description: 'Tentativas de processamento de mensagens de notes-consumer que terminam em até 1s. Consumo sustentado de 3x ou 1x o ritmo sustentável: mantido, o error budget de 30 dias se esgota antes do fim da janela. Sem urgência: investigue em horário comercial, pelo dashboard do serviço (qual SLI piorou e desde quando) e depois pelos logs de erro de notes-consumer.'
          summary: 'SLO consumer-latency de notes-consumer consumindo o error budget acima do ritmo sustentável: {{ $value | humanizePercentage }} de eventos ruins na janela curta (2h ou 6h)'
          title: SLO consumer-latency de notes-consumer consumindo o error budget acima do ritmo sustentável

  - name: sloth-slo-alerts-notes-outbox-freshness
    rules:
      - alert: SLOBurnRate
        expr: |
          (
              max(slo:sli_error:ratio_rate5m{sloth_id="notes-outbox-freshness", sloth_service="notes", sloth_slo="outbox-freshness"} > (14.4 * 0.01)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate1h{sloth_id="notes-outbox-freshness", sloth_service="notes", sloth_slo="outbox-freshness"} > (14.4 * 0.01)) without (sloth_window)
          )

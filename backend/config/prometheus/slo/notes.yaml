          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:period_error_budget_remaining:ratio
        expr: 1 - slo:period_burn_rate:ratio{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability

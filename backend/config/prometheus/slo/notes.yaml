        expr: |
          slo:sli_error:ratio_rate5m{sloth_id="notes-outbox-freshness", sloth_service="notes", sloth_slo="outbox-freshness"}
          / on(sloth_id, sloth_slo, sloth_service) group_left
          slo:error_budget:ratio{sloth_id="notes-outbox-freshness", sloth_service="notes", sloth_slo="outbox-freshness"}
        labels:
          service: notes-worker-forwarder
          sloth_id: notes-outbox-freshness
          sloth_service: notes
          sloth_slo: outbox-freshness
      - record: slo:period_burn_rate:ratio
        expr: |
          slo:sli_error:ratio_rate30d{sloth_id="notes-outbox-freshness", sloth_service="notes", sloth_slo="outbox-freshness"}
          / on(sloth_id, sloth_slo, sloth_service) group_left
          slo:error_budget:ratio{sloth_id="notes-outbox-freshness", sloth_service="notes", sloth_slo="outbox-freshness"}

          sloth_service: notes
          sloth_slo: outbox-freshness
      - record: slo:time_period:days
        expr: vector(30)
        labels:
          service: notes-worker-forwarder
          sloth_id: notes-outbox-freshness
          sloth_service: notes
          sloth_slo: outbox-freshness

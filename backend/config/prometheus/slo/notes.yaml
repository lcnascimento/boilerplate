    rules:
      - record: slo:objective:ratio
        expr: vector(0.9990000000000001)
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:error_budget:ratio
        expr: vector(1-0.9990000000000001)
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:time_period:days
        expr: vector(30)
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:current_burn_rate:ratio
        expr: |
          slo:sli_error:ratio_rate5m{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
          / on(sloth_id, sloth_slo, sloth_service) group_left
          slo:error_budget:ratio{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:period_burn_rate:ratio
        expr: |
          slo:sli_error:ratio_rate30d{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
          / on(sloth_id, sloth_slo, sloth_service) group_left
          slo:error_budget:ratio{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
        labels:

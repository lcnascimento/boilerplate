  - name: sloth-slo-meta-recordings-notes-api-availability
    rules:
      - record: slo:objective:ratio
        expr: vector(0.9990000000000001)
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:error_budget:ratio
        expr: vector(1-0.9990000000000001)
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:time_period:days
        expr: vector(30)
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:current_burn_rate:ratio
        expr: |
          slo:sli_error:ratio_rate5m{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
          / on(sloth_id, sloth_slo, sloth_service) group_left
          slo:error_budget:ratio{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:period_burn_rate:ratio
        expr: |
          slo:sli_error:ratio_rate30d{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
          / on(sloth_id, sloth_slo, sloth_service) group_left
          slo:error_budget:ratio{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: slo:period_error_budget_remaining:ratio
        expr: 1 - slo:period_burn_rate:ratio{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"}
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_service: notes
          sloth_slo: api-availability
      - record: sloth_slo_info
        expr: vector(1)
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability
          sloth_mode: cli-gen-prom
          sloth_objective: "99.9"
          sloth_service: notes
          sloth_slo: api-availability
          sloth_spec: prometheus/v1
          sloth_version: v0.16.0
  - name: sloth-slo-alerts-notes-api-availability
    rules:
      - alert: SLOBurnRate
        expr: |
          (
              max(slo:sli_error:ratio_rate5m{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (14.4 * 0.0009999999999999432)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate1h{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (14.4 * 0.0009999999999999432)) without (sloth_window)
          )
          or
          (
              max(slo:sli_error:ratio_rate30m{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (6 * 0.0009999999999999432)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate6h{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (6 * 0.0009999999999999432)) without (sloth_window)
          )
        labels:
          service: notes-api-frontend
          severity: critical
          sloth_severity: page
          sloth_slo: api-availability
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: Requisições HTTP de notes-api-frontend respondidas sem 5xx, fora as de health e readiness. No ritmo atual, o error budget de 30 dias acaba antes do fim da janela. Veja primeiro no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-api-frontend.
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
          summary: 'SLO api-availability de notes-api-frontend queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta ({{ $labels.sloth_severity }})'
          title: SLO api-availability de notes-api-frontend queimando o error budget rápido demais
      - alert: SLOBurnRate
        expr: |
          (
              max(slo:sli_error:ratio_rate2h{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (3 * 0.0009999999999999432)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate1d{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (3 * 0.0009999999999999432)) without (sloth_window)
          )
          or

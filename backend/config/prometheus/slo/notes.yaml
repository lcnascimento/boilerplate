          sloth_service: notes
          sloth_slo: api-availability
          sloth_spec: prometheus/v1
          sloth_version: v0.16.0
  - name: sloth-slo-alerts-notes-api-availability
    rules:
      - alert: SLOBurnRate
        expr: |
          (
              max(slo:sli_error:ratio_rate5m{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (14.4 * 0.0009999999999999432)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate1h{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (14.4 * 0.0009999999999999432)) without (sloth_window)
          )
          or
          (
              max(slo:sli_error:ratio_rate30m{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (6 * 0.0009999999999999432)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate6h{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (6 * 0.0009999999999999432)) without (sloth_window)
          )
        labels:
          service: notes-api-frontend
          severity: critical
          sloth_severity: page
          sloth_slo: api-availability
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: 'Requisições HTTP de notes-api-frontend respondidas sem 5xx, fora as de health e readiness. Incidente em andamento: a 14,4x ou 6x o ritmo sustentável, o error budget de 30 dias acaba em 2 a 5 dias. Aja agora: veja no dashboard do serviço qual SLI piorou e desde quando, depois os logs de erro de notes-api-frontend.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
          summary: 'SLO api-availability de notes-api-frontend queimando o error budget rápido demais: {{ $value | humanizePercentage }} de eventos ruins na janela curta (5m ou 30m)'
          title: SLO api-availability de notes-api-frontend queimando o error budget rápido demais
      - alert: SLOBurnRate
        expr: |
          (
              max(slo:sli_error:ratio_rate2h{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (3 * 0.0009999999999999432)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate1d{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (3 * 0.0009999999999999432)) without (sloth_window)
          )
          or
          (
              max(slo:sli_error:ratio_rate6h{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (1 * 0.0009999999999999432)) without (sloth_window)
              and
              max(slo:sli_error:ratio_rate3d{sloth_id="notes-api-availability", sloth_service="notes", sloth_slo="api-availability"} > (1 * 0.0009999999999999432)) without (sloth_window)
          )
        labels:
          service: notes-api-frontend
          severity: warning
          sloth_severity: ticket
          sloth_slo: api-availability
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: 'Requisições HTTP de notes-api-frontend respondidas sem 5xx, fora as de health e readiness. Consumo sustentado de 3x ou 1x o ritmo sustentável: mantido, o error budget de 30 dias se esgota antes do fim da janela. Sem urgência: investigue em horário comercial, pelo dashboard do serviço (qual SLI piorou e desde quando) e depois pelos logs de erro de notes-api-frontend.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SLOBurnRate.md
          summary: 'SLO api-availability de notes-api-frontend consumindo o error budget acima do ritmo sustentável: {{ $value | humanizePercentage }} de eventos ruins na janela curta (2h ou 6h)'
          title: SLO api-availability de notes-api-frontend consumindo o error budget acima do ritmo sustentável

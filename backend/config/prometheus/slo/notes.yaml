groups:
  - name: sloth-slo-sli-recordings-notes-api-availability
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: |
          (sum(rate(http_server_request_total{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health",http_response_status_code=~"5.."}[5m])))
          /
          (sum(rate(http_server_request_total{job="boilerplate/notes-api-frontend",http_route!~"/ping|/health"}[5m])))
        labels:
          service: notes-api-frontend
          sloth_id: notes-api-availability

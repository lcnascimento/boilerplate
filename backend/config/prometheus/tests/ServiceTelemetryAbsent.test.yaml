rule_files:
  - fixture.yaml

evaluation_interval: 1m

tests:
  - name: fires only for the process whose target_info stopped more than five minutes ago
    interval: 1m
    input_series:
      - series: target_info{job="boilerplate/fixture-api"}
        values: 1x10
      - series: target_info{job="boilerplate/fixture-consumer"}
        values: 1x30
      - series: target_info{job="boilerplate/fixture-worker"}
        values: 1x30
    alert_rule_test:
      - eval_time: 14m
        alertname: ServiceTelemetryAbsent
        exp_alerts: []
      - eval_time: 16m
        alertname: ServiceTelemetryAbsent
        exp_alerts:
          - exp_labels:
              job: boilerplate/fixture-api
              service: fixture-api
              severity: critical
            exp_annotations:
              summary: fixture-api não envia telemetria há 5 minutos
              description: "Nenhum target_info de fixture-api chegou ao Prometheus nos últimos 5 minutos: o processo caiu, travou ou não alcança o Alloy. Veja primeiro se ele está no ar e os logs dele."
              runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/ServiceTelemetryAbsent.md
              dashboard_url: http://localhost:3010/d/boilerplate-fixture

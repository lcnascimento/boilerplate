groups:
  - name: audit
    rules:
      - alert: ServiceTelemetryAbsent
        expr: absent_over_time(target_info{job="boilerplate/audit-consumer"}[5m])
        labels:
          service: audit-consumer
          severity: critical
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-overview
          description: 'Nenhum target_info de audit-consumer chegou ao Prometheus nos últimos 5 minutos: o processo caiu, travou ou não alcança o Alloy. Veja primeiro se ele está no ar e os logs dele.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/ServiceTelemetryAbsent.md
          summary: audit-consumer não envia telemetria há 5 minutos
      - alert: DBPoolSaturated
        expr: max(pgxpool_acquired_connections{job="boilerplate/audit-consumer"} / pgxpool_max_connections{job="boilerplate/audit-consumer"}) > 0.9
        for: 5m
        labels:
          service: audit-consumer
          severity: warning
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-overview
          description: Mais de 90% das conexões do pool pgx de audit-consumer estão em uso há 5 minutos, então as queries esperam por conexão. Veja primeiro as queries lentas e os locks no Postgres, depois o volume de requisições do processo.
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/DBPoolSaturated.md
          summary: Pool do Postgres de audit-consumer com {{ $value | humanizePercentage }} das conexões em uso
      - alert: ConsumerLagHigh
        expr: sum by (consumergroup) (kafka_consumergroup_uncommitted_offsets{consumergroup="audit"}) > 100
        for: 5m
        labels:
          service: audit-consumer
          severity: warning
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-messaging
          description: 'O consumer group audit está mais de 100 mensagens atrás há 5 minutos: o consumo está mais lento que a produção, ou parado. Veja primeiro se audit-consumer está no ar e a duração do processamento no dashboard messaging.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/ConsumerLagHigh.md
          summary: Consumer group audit de audit-consumer com {{ $value | humanize }} mensagens atrasadas
      - alert: DLQMessageReceived
        expr: sum by (topic) (increase(kafka_topic_partition_current_offset{topic=~".+\\.audit\\.dlq"}[5m])) > 0
        labels:
          service: audit-consumer
          severity: critical
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-messaging
          description: 'audit-consumer mandou mensagens à DLQ: elas falharam de forma permanente e não serão reprocessadas sozinhas. Veja primeiro o error_type no painel de envios à DLQ do dashboard messaging e os logs de audit-consumer.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/DLQMessageReceived.md
          summary: '{{ $value | humanize }} mensagem(ns) nova(s) na DLQ {{ $labels.topic }} de audit-consumer'

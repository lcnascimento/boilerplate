groups:
  - name: notes-api-frontend
    rules:
      - alert: ServiceTelemetryAbsent
        expr: absent_over_time(target_info{job="boilerplate/notes-api-frontend"}[5m])
        labels:
          service: notes-api-frontend
          severity: critical
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: 'Nenhum target_info de notes-api-frontend chegou ao Prometheus nos últimos 5 minutos: o processo caiu, travou ou não alcança o Alloy. Veja primeiro se ele está no ar e os logs dele.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/ServiceTelemetryAbsent.md
          summary: notes-api-frontend não envia telemetria há 5 minutos
      - alert: HealthCheckFailing
        expr: sum by (job) (increase(http_server_request_total{job="boilerplate/notes-api-frontend", http_route="/health", http_response_status_code=~"5.."}[2m])) > 0 unless sum by (job) (increase(http_server_request_total{job="boilerplate/notes-api-frontend", http_route="/health", http_response_status_code=~"2.."}[2m])) > 0
        labels:
          service: notes-api-frontend
          severity: critical
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: 'Todo /health de notes-api-frontend respondeu 5xx nos últimos 2 minutos: uma dependência que ele checa (o Postgres) está fora, e quem faz o probe o considera fora do ar. Veja primeiro nos logs de notes-api-frontend por que o health check falha e os alertas das dependências (PostgresDown).'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/HealthCheckFailing.md
          summary: notes-api-frontend responde 5xx em todo /health há 2 minutos
      - alert: DBPoolSaturated
        expr: max(pgxpool_acquired_connections{job="boilerplate/notes-api-frontend"} / pgxpool_max_connections{job="boilerplate/notes-api-frontend"}) > 0.9
        for: 5m
        labels:
          service: notes-api-frontend
          severity: warning
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: Mais de 90% das conexões do pool pgx de notes-api-frontend estão em uso há 5 minutos, então as queries esperam por conexão. Veja primeiro as queries lentas e os locks no Postgres, depois o volume de requisições do processo.
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/DBPoolSaturated.md
          summary: Pool do Postgres de notes-api-frontend com {{ $value | humanizePercentage }} das conexões em uso
      - alert: AuthenticationFailuresHigh
        expr: sum(rate(http_server_request_total{job="boilerplate/notes-api-frontend", http_route!~"/ping|/health", http_response_status_code="401"}[5m])) / sum(rate(http_server_request_total{job="boilerplate/notes-api-frontend", http_route!~"/ping|/health"}[5m])) > 0.1
        for: 5m
        labels:
          service: notes-api-frontend
          severity: warning
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: 'Mais de 10% das requisições de notes-api-frontend respondem 401 há 5 minutos: credenciais ou tokens recusados em massa. Veja primeiro os motivos na linha Autenticação e autorização do dashboard do serviço.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/AuthenticationFailuresHigh.md
          summary: notes-api-frontend responde 401 a {{ $value | humanizePercentage }} das requisições
      - alert: SeriesBudgetExceeded
        expr: job:series:count{job="boilerplate/notes-api-frontend"} > 2000
        for: 15m
        labels:
          service: notes-api-frontend
          severity: warning
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-postgres
          description: 'notes-api-frontend mantém mais de 2000 séries no Prometheus há 15 minutos: algum atributo de métrica tem valores sem limite (ID, URL crua, mensagem de erro). Veja primeiro quais métricas do job têm mais séries, depois o atributo que as multiplica.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SeriesBudgetExceeded.md
          summary: notes-api-frontend com {{ $value | humanize }} séries, acima do teto de 2000
      - alert: CriticalLogRecorded
        expr: sum_over_time(service:log_records_critical:rate1m{service="notes-api-frontend"}[5m]) * 60 > 0
        labels:
          service: notes-api-frontend
          severity: critical
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: notes-api-frontend registrou um log com severidade Critical ou Fatal (severity_number >= 21), o que costuma ser um panic ou um bug que não queima budget de SLO. Veja primeiro esses logs na seção Logs do dashboard do serviço e o trace ligado a cada um.
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/CriticalLogRecorded.md
          summary: '{{ $value | humanize }} log(s) Critical ou Fatal de notes-api-frontend nos últimos 5 minutos'
  - name: notes-worker-forwarder
    rules:
      - alert: ServiceTelemetryAbsent
        expr: absent_over_time(target_info{job="boilerplate/notes-worker-forwarder"}[5m])
        labels:
          service: notes-worker-forwarder
          severity: critical
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: 'Nenhum target_info de notes-worker-forwarder chegou ao Prometheus nos últimos 5 minutos: o processo caiu, travou ou não alcança o Alloy. Veja primeiro se ele está no ar e os logs dele.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/ServiceTelemetryAbsent.md
          summary: notes-worker-forwarder não envia telemetria há 5 minutos
      - alert: HealthCheckFailing
        expr: sum by (job) (increase(http_server_request_total{job="boilerplate/notes-worker-forwarder", http_route="/health", http_response_status_code=~"5.."}[2m])) > 0 unless sum by (job) (increase(http_server_request_total{job="boilerplate/notes-worker-forwarder", http_route="/health", http_response_status_code=~"2.."}[2m])) > 0
        labels:
          service: notes-worker-forwarder
          severity: critical
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: 'Todo /health de notes-worker-forwarder respondeu 5xx nos últimos 2 minutos: uma dependência que ele checa (o Postgres, o forwarder e o Kafka) está fora, e quem faz o probe o considera fora do ar. Veja primeiro nos logs de notes-worker-forwarder por que o health check falha e os alertas das dependências (PostgresDown, KafkaBrokersDown).'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/HealthCheckFailing.md
          summary: notes-worker-forwarder responde 5xx em todo /health há 2 minutos
      - alert: DBPoolSaturated
        expr: max(pgxpool_acquired_connections{job="boilerplate/notes-worker-forwarder"} / pgxpool_max_connections{job="boilerplate/notes-worker-forwarder"}) > 0.9
        for: 5m
        labels:
          service: notes-worker-forwarder
          severity: warning
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: Mais de 90% das conexões do pool pgx de notes-worker-forwarder estão em uso há 5 minutos, então as queries esperam por conexão. Veja primeiro as queries lentas e os locks no Postgres, depois o volume de requisições do processo.
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/DBPoolSaturated.md
          summary: Pool do Postgres de notes-worker-forwarder com {{ $value | humanizePercentage }} das conexões em uso
      - alert: OutboxAgeAbsent
        expr: absent(notes_outbox_oldest_pending_age_seconds{job="boilerplate/notes-worker-forwarder"})
        for: 5m
        labels:
          service: notes-worker-forwarder
          severity: critical
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: 'notes-worker-forwarder não reporta notes_outbox_oldest_pending_age_seconds: sem forwarder ninguém esvazia o outbox e os Integration Events param de sair. Veja primeiro se notes-worker-forwarder está no ar e os logs dele.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/OutboxAgeAbsent.md
          summary: notes-worker-forwarder não reporta a idade do outbox há 5 minutos
      - alert: SeriesBudgetExceeded
        expr: job:series:count{job="boilerplate/notes-worker-forwarder"} > 2000
        for: 15m
        labels:
          service: notes-worker-forwarder
          severity: warning
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-postgres
          description: 'notes-worker-forwarder mantém mais de 2000 séries no Prometheus há 15 minutos: algum atributo de métrica tem valores sem limite (ID, URL crua, mensagem de erro). Veja primeiro quais métricas do job têm mais séries, depois o atributo que as multiplica.'
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/SeriesBudgetExceeded.md
          summary: notes-worker-forwarder com {{ $value | humanize }} séries, acima do teto de 2000
      - alert: CriticalLogRecorded
        expr: sum_over_time(service:log_records_critical:rate1m{service="notes-worker-forwarder"}[5m]) * 60 > 0
        labels:
          service: notes-worker-forwarder
          severity: critical
        annotations:
          dashboard_url: http://localhost:3010/d/boilerplate-notes
          description: notes-worker-forwarder registrou um log com severidade Critical ou Fatal (severity_number >= 21), o que costuma ser um panic ou um bug que não queima budget de SLO. Veja primeiro esses logs na seção Logs do dashboard do serviço e o trace ligado a cada um.
          runbook_url: https://github.com/lcnascimento/boilerplate/blob/main/docs/runbooks/CriticalLogRecorded.md
          summary: '{{ $value | humanize }} log(s) Critical ou Fatal de notes-worker-forwarder nos últimos 5 minutos'

global:
  scrape_interval: 15s
  evaluation_interval: 1m
  rule_query_offset: 1m

rule_files:
  - /etc/prometheus/rules/*.yaml

otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

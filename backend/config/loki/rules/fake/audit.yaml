groups:
  - name: audit
    rules:
      - record: service:log_records:rate1m
        expr: sum by (service,level,deployment_environment)(rate({service_namespace="boilerplate", service_name=~"audit-consumer|audit-migrate"} | label_format service=service_name,level=detected_level[1m]))
      - record: service:log_records_critical:rate1m
        expr: sum by (service,deployment_environment)(rate({service_namespace="boilerplate", service_name=~"audit-consumer|audit-migrate"} | severity_number>=21 | label_format service=service_name[1m]))

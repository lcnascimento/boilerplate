apiVersion: 1

groups:
  - orgId: 1
    name: messaging
    folder: Messaging
    interval: 30s
    rules:
      # example:begin
      - uid: messaging-outbox-stuck
        title: Outbox travado
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          area: messaging
          severity: critical
        annotations:
          summary: O outbox de notes tem mensagem pendente há mais de 120s, ou nenhum forwarder reporta a idade dela.
          description: O forwarder não está levando o outbox para o Kafka. Veja o health do notes-worker-forwarder e a conexão com o broker.
          __dashboardUid__: boilerplate-messaging
          __panelId__: "8"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(last_over_time(notes_outbox_oldest_pending_age_seconds[2m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [120]

      - uid: messaging-audit-lag
        title: Consumer group audit atrasado
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          area: messaging
          severity: warning
        annotations:
          summary: O consumer group audit está {{ $values.A.Value }} mensagens atrás.
          description: O audit-consumer está parado ou lento. Veja o health do audit-consumer e as tentativas no dashboard messaging.
          __dashboardUid__: boilerplate-messaging
          __panelId__: "15"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(kafka_consumergroup_uncommitted_offsets{consumergroup="audit"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [100]
      # example:end

      - uid: messaging-dlq-received
        title: Mensagem na DLQ
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          area: messaging
          severity: critical
        annotations:
          summary: '{{ printf "%.0f" $values.A.Value }} mensagens chegaram às DLQs nos últimos 5 minutos.'
          description: Um consumer mandou mensagens que não consegue processar para a DLQ. Leia os headers de poison delas no Kafka Console.
          __dashboardUid__: boilerplate-messaging
          __panelId__: "24"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(kafka_topic_partition_current_offset{topic=~".+\\.dlq"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

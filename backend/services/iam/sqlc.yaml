version: "2"
sql:
  - engine: postgresql
    schema: internal/repository/migrations
    queries: internal/repository/changes/queries.sql
    gen:
      go:
        package: db
        out: internal/repository/changes/internal/db
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true

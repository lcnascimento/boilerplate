syntax = "proto3";

package boilerplate.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lcnascimento/boilerplate/backend/services/iam/pkg/events;events";

message SignInFailed {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_INVALID_CREDENTIALS = 1;
    REASON_INVALID_INPUT = 2;
  }

  Reason reason = 1;
  google.protobuf.Timestamp failed_at = 2;
}

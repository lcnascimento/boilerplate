syntax = "proto3";

package boilerplate.iam.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lcnascimento/boilerplate/backend/services/iam/pkg/events;events";

message SessionStarted {
  string session_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp started_at = 3;
}

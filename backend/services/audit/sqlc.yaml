version: "2"
sql:
  - engine: postgresql
    schema: internal/repository/migrations
    queries: internal/repository/entries/queries.sql
    gen:
      go:
        package: db
        out: internal/repository/entries/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - column: audit_entries.headers
            go_type:
              type: map[string]string

// Within a major version only additive changes are allowed. A breaking change
// opens the next major topic (notes.note.v2), published alongside v1 until
// every consumer has migrated.
syntax = "proto3";

package boilerplate.notes.v1;

option go_package = "github.com/lcnascimento/boilerplate/backend/services/notes/pkg/events;events";

message NoteDeleted {
  string id = 1;
}

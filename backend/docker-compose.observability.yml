services:
  alloy:
    container_name: alloy
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
      - "12347:12347"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./config/alloy/postgres-queries.yaml:/etc/alloy/postgres-queries.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
      # prometheus.exporter.kafka fails the whole config, and Alloy exits, when the broker is unreachable at start.
      kafka:
        condition: service_healthy
    networks:
      - boilerplate

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=35d
      - --enable-feature=exemplar-storage
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks:
      - boilerplate

  loki:
    container_name: loki
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki_data:/loki
    networks:
      - boilerplate

  tempo:
    container_name: tempo
    # Tempo 3.x drops `ingester`, `local_blocks` and `traces_storage`, which config/tempo/tempo.yaml uses.
    image: grafana/tempo:2.10.8
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - boilerplate

  pyroscope:
    container_name: pyroscope
    image: grafana/pyroscope:2.4.0
    ports:
      - "4040:4040"
    volumes:
      - pyroscope_data:/var/lib/pyroscope
    networks:
      - boilerplate

  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.3
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/overview.json
    ports:
      - "3010:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
      - pyroscope
    networks:
      - boilerplate

volumes:
  alloy_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  pyroscope_data:

networks:
  boilerplate:
    driver: bridge
    name: boilerplate

services:
  scalar:
    image: scalarapi/api-reference:0.6.12
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      # The image builds its sources list from MOUNT_DIR once, at startup.
      MOUNT_DIR: /sources
    volumes:
      - .:/docs:ro
      # example:begin
      - ./notes.yaml:/sources/notes.yaml:ro
      # example:end

name: ci-template

on: push

permissions:
  contents: read

concurrency:
  group: ci-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    name: A / make init
    if: github.repository == 'lcnascimento/boilerplate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.work
          cache-dependency-path: backend/**/go.sum

      - name: make init
        run: make init NAME=acme-app

      - name: No marker left
        run: |
          ! git grep -ni boilerplate || exit 1
          ! git ls-files -co --exclude-standard | grep -i boilerplate || exit 1

      - name: Template-only parts are gone
        run: |
          test ! -e scripts/init.sh
          test ! -e .github/workflows/ci-template.yml
          test ! -e docs/agents
          ! grep -q '^init:' Makefile || exit 1
          ! grep -q '^## Como instanciar' README.md || exit 1
          test "$(grep '^## ' CLAUDE.md)" = "## Language"
          test "$(head -1 README.md)" = "# Acme App"
          grep -q 'APP_NAME = "Acme App"' frontend/apps/web/shared/components/nav-sidebar.tsx

      - name: clean-example still runs after init
        run: |
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "chore: init"
          make clean-example

  init-backend:
    name: A / backend
    needs: init
    uses: ./.github/workflows/ci-backend.yml
    with:
      bootstrap: make init NAME=acme-app

  init-frontend:
    name: A / frontend
    needs: init
    uses: ./.github/workflows/ci-frontend.yml
    with:
      bootstrap: make init NAME=acme-app

  init-openapi:
    name: A / openapi
    needs: init
    uses: ./.github/workflows/ci-openapi.yml
    with:
      bootstrap: make init NAME=acme-app

  init-proto:
    name: A / proto
    needs: init
    uses: ./.github/workflows/ci-proto.yml
    with:
      bootstrap: make init NAME=acme-app

  init-e2e:
    name: A / e2e
    needs: init
    uses: ./.github/workflows/ci-e2e.yml
    with:
      bootstrap: make init NAME=acme-app

  init-suppressions:
    name: A / suppressions
    needs: init
    uses: ./.github/workflows/ci-suppressions.yml
    with:
      bootstrap: make init NAME=acme-app

  clean-init:
    name: B / make clean-example + make init
    if: github.repository == 'lcnascimento/boilerplate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.work
          cache-dependency-path: backend/**/go.sum

      - name: make clean-example
        run: make clean-example

      - name: Commit, so init finds a clean tree
        run: |
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "chore: remove the example"

      - name: make init
        run: make init NAME=acme-app

      - name: No fence nor marker left
        run: |
          ! git grep -n 'example[:]' || exit 1
          ! git grep -ni boilerplate || exit 1
          ! git ls-files -co --exclude-standard | grep -i boilerplate || exit 1

      - name: Zero services
        run: |
          test "$(grep -E '^[[:space:]]*(use|\./)' backend/go.work | tr -d ' \t')" = "$(printf 'use./quality\nuse./tools')"
          test ! -e Makefile
          test ! -e scripts

  clean-init-backend:
    name: B / backend
    needs: clean-init
    uses: ./.github/workflows/ci-backend.yml
    with:
      bootstrap: &clean-init 'make clean-example && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "chore: remove the example" && make init NAME=acme-app'

  clean-init-frontend:
    name: B / frontend
    needs: clean-init
    uses: ./.github/workflows/ci-frontend.yml
    with:
      bootstrap: *clean-init

  clean-init-openapi:
    name: B / openapi
    needs: clean-init
    uses: ./.github/workflows/ci-openapi.yml
    with:
      bootstrap: *clean-init

  clean-init-proto:
    name: B / proto
    needs: clean-init
    uses: ./.github/workflows/ci-proto.yml
    with:
      bootstrap: *clean-init

  clean-init-e2e:
    name: B / e2e
    needs: clean-init
    uses: ./.github/workflows/ci-e2e.yml
    with:
      bootstrap: *clean-init

  clean-init-suppressions:
    name: B / suppressions
    needs: clean-init
    uses: ./.github/workflows/ci-suppressions.yml
    with:
      bootstrap: *clean-init

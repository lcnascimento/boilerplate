name: template

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: template-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GENERATED_WORKFLOWS: pull_request.yml quality_gate.yml release.yml

jobs:
  init:
    name: A / make init
    if: github.repository == 'lcnascimento/boilerplate' && (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP: 'make init NAME=acme-app && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "chore: init"'
    outputs:
      bootstrap: ${{ env.BOOTSTRAP }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: make init, commit
        run: bash -euo pipefail -c "$BOOTSTRAP"

      - name: No marker left
        run: |
          ! git grep -ni boilerplate || exit 1
          ! git ls-files -co --exclude-standard | grep -i boilerplate || exit 1

      - name: Template-only parts are gone
        run: |
          test ! -e scripts/init.sh
          test "$(ls .github/workflows | xargs)" = "$GENERATED_WORKFLOWS"
          test ! -e docs/agents
          ! grep -q '^init:' Makefile || exit 1
          ! grep -q '^## Como instanciar' README.md || exit 1
          test "$(grep '^## ' CLAUDE.md)" = "## Language"
          test "$(head -1 README.md)" = "# Acme App"
          grep -q 'APP_NAME = "Acme App"' frontend/apps/web/shared/components/organization-menu.tsx

      - name: clean-example still runs after init
        run: make clean-example

  init-quality_gate:
    name: A
    needs: init
    uses: ./.github/workflows/quality_gate.yml
    with:
      bootstrap: ${{ needs.init.outputs.bootstrap }}

  clean-init:
    name: B / make clean-example + make init
    if: github.repository == 'lcnascimento/boilerplate' && (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    env:
      BOOTSTRAP: 'make clean-example && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "chore: remove the example" && make init NAME=acme-app && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "chore: init"'
    outputs:
      bootstrap: ${{ env.BOOTSTRAP }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: make clean-example, commit, make init, commit
        run: bash -euo pipefail -c "$BOOTSTRAP"

      - name: No fence nor marker left
        run: |
          ! git grep -n 'example[:]' || exit 1
          ! git grep -ni boilerplate || exit 1
          ! git ls-files -co --exclude-standard | grep -i boilerplate || exit 1

      - name: Only the core services
        run: |
          test "$(grep -E '^[[:space:]]*(use|\./)' backend/go.work | tr -d ' \t')" = "$(printf 'use./quality\nuse./services/audit\nuse./services/iam\nuse./services/iam/pkg\nuse./tools')"
          ! grep -qE '^(init|clean-example):' Makefile || exit 1
          test ! -e scripts
          test "$(ls .github/workflows | xargs)" = "$GENERATED_WORKFLOWS"

      - name: Identity stays, without a trace of Notes
        run: |
          grep -q "include('./services/iam/Tiltfile')" backend/Tiltfile
          grep -q "include('./services/audit/Tiltfile')" backend/Tiltfile
          grep -q "'iam-seed'" frontend/Tiltfile
          ! git grep -nIiwE 'notes?' || exit 1

  clean-init-quality_gate:
    name: B
    needs: clean-init
    uses: ./.github/workflows/quality_gate.yml
    with:
      bootstrap: ${{ needs.clean-init.outputs.bootstrap }}

name: ci-backend

on:
  workflow_call:
    inputs:
      bootstrap:
        description: Shell command run at the repository root right after checkout.
        type: string
        default: ""
  pull_request:
    paths:
      - "backend/**"
      - "frontend/apps/web/shared/auth/roles.gen.ts"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}-${{ inputs.bootstrap }}
  cancel-in-progress: true

jobs:
  ci-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap
        if: inputs.bootstrap
        working-directory: .
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: bash -euo pipefail -c "$BOOTSTRAP"

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.work
          cache-dependency-path: backend/**/go.sum

      - name: Restore the Go tool binaries
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: gobin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Makefile') }}

      - name: Setup
        run: make setup

      - name: Generated files are up to date
        run: |
          for target in sqlc mocks o11y.generate iam.generate; do
            git add -A
            make "$target"
            git diff --exit-code || { echo "make $target changed tracked files"; exit 1; }
            untracked=$(git ls-files --others --exclude-standard)
            if [ -n "$untracked" ]; then echo "make $target created untracked files:"; echo "$untracked"; exit 1; fi
          done

      - name: o11y.lint
        run: make o11y.lint

      - name: Lint
        run: make lint

      - name: Postgres
        run: docker compose up -d --wait postgres

      - name: Test
        run: make test

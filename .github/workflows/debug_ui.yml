name: debug_ui

on: pull_request

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        mode: [backend_turbo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          playwright: shell

      - name: loop
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          DEBUG: vite:deps,vite:time,pw:browser*
        run: |
          nproc; uname -m
          runs=1
          red=0
          for i in $(seq 1 $runs); do
            rm -rf frontend/packages/ui/node_modules/.cache frontend/packages/ui/node_modules/.vite
            {
              if [ "$MODE" = backend_turbo ]; then make -C backend test || true; fi
              (cd frontend && pnpm turbo run test --force --env-mode=loose) || true
            } > run-$i.log 2>&1
            if grep -q "Failed to fetch dynamically imported module" run-$i.log; then
              red=$((red+1)); echo "::warning::run $i RED"
              sed 's/\x1b\[[0-9;]*m//g' run-$i.log | grep -E "vite:deps|vitest|FAIL|Caused by|optimiz|reload|504" | cut -c1-300 | head -120
            else
              echo "run $i green: $(sed 's/\x1b\[[0-9;]*m//g' run-$i.log | grep -E 'Test Files' | tail -1)"
            fi
          done
          echo "red=$red/$runs"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.mode }}-${{ matrix.shard }}
          path: run-*.log

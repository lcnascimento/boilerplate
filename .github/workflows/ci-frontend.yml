name: ci-frontend

on:
  workflow_call:
    inputs:
      bootstrap:
        description: Shell command run at the repository root right after checkout.
        type: string
        default: ""
  pull_request:
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/ci-frontend.yml"

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}-${{ inputs.bootstrap }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Set only when another workflow calls this one: the template's own CI
      # passes `make init` / `make clean-example` here, then runs the checks.
      - name: Bootstrap
        if: inputs.bootstrap
        working-directory: .
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: bash -euo pipefail -c "$BOOTSTRAP"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm turbo run test --filter='!./packages/ui'

      - name: Install Playwright Chromium
        run: pnpm --filter ./packages/ui exec playwright install --with-deps --only-shell chromium

      - name: Story tests
        run: pnpm turbo run test --filter=./packages/ui

      - name: Build
        run: pnpm turbo run build

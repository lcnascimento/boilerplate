name: pull_request

on: pull_request

permissions:
  contents: read

concurrency:
  group: pull_request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality_gate:
    uses: ./.github/workflows/quality_gate.yml

  lint-breaking:
    name: lint.breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Fetch the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: make lint.breaking
        run: make lint.breaking AGAINST=FETCH_HEAD

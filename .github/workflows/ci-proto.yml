name: ci-proto

on:
  workflow_call:
    inputs:
      bootstrap:
        description: Shell command run at the repository root right after checkout.
        type: string
        default: ""
  pull_request:
    paths:
      - "backend/**/*.proto"
      - "backend/**/buf.yaml"
      - "backend/**/buf.gen.yaml"
      - "backend/**/*.pb.go"
      - "backend/Makefile"
      - ".github/workflows/ci-proto.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**/*.proto"
      - "backend/**/buf.yaml"
      - "backend/**/buf.gen.yaml"
      - "backend/**/*.pb.go"
      - "backend/Makefile"
      - ".github/workflows/ci-proto.yml"

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap
        if: inputs.bootstrap
        working-directory: .
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: bash -euo pipefail -c "$BOOTSTRAP"

      - name: Detect buf modules
        id: detect
        run: |
          if [ -z "$(git ls-files -- '*buf.yaml')" ]; then
            echo "No buf.yaml in the repository, nothing to check."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.detect.outputs.found == 'true'
        with:
          go-version-file: backend/go.work
          cache-dependency-path: backend/**/go.sum

      - name: Setup
        if: steps.detect.outputs.found == 'true'
        run: make proto.tools

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: make proto.lint

      - name: Generate
        if: steps.detect.outputs.found == 'true'
        run: |
          git add -A
          make proto.generate
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then echo "make proto.generate created untracked files:"; echo "$untracked"; exit 1; fi

      - name: Breaking
        if: steps.detect.outputs.found == 'true' && !inputs.bootstrap
        env:
          AGAINST: ${{ github.event_name == 'pull_request' && 'main' || github.event.before }}
        run: |
          if [ -z "$AGAINST" ] || [ "$AGAINST" = "0000000000000000000000000000000000000000" ]; then
            echo "No reference to compare against, skipping."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$AGAINST"
          make proto.breaking AGAINST=FETCH_HEAD

name: ci-e2e

on:
  workflow_call:
    inputs:
      bootstrap:
        description: Shell command run at the repository root right after checkout.
        type: string
        default: ""
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "Tiltfile"
      - "**/Tiltfile"
      - ".nvmrc"
      - ".github/workflows/ci-e2e.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Tiltfile"
      - "**/Tiltfile"
      - ".nvmrc"
      - ".github/workflows/ci-e2e.yml"

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.ref }}-${{ inputs.bootstrap }}
  cancel-in-progress: true

env:
  TILT_VERSION: 0.37.8

defaults:
  run:
    working-directory: frontend

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap
        if: inputs.bootstrap
        working-directory: .
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: bash -euo pipefail -c "$BOOTSTRAP"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.work
          cache-dependency-path: backend/**/go.sum

      - name: Install Playwright Chromium
        run: pnpm --filter ./apps/web exec playwright install --with-deps chromium

      - name: Restore the next dev cache
        uses: actions/cache@v6
        with:
          path: frontend/apps/web/.next/dev/cache
          key: next-dev-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: next-dev-

      - name: Install Tilt
        working-directory: .
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/tilt-dev/tilt/releases/download/v${TILT_VERSION}/tilt.${TILT_VERSION}.linux.x86_64.tar.gz" |
            tar -xz -C "$HOME/.local/bin" tilt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/tilt" version

      - name: Start the stack
        working-directory: .
        run: |
          tilt up --stream > "$RUNNER_TEMP/tilt-up.log" 2>&1 &
          for _ in $(seq 60); do
            tilt get uiresource > /dev/null 2>&1 && break
            sleep 1
          done
          # Tilt registers the resources only once the Tiltfile has loaded.
          tilt wait --for=condition=Ready 'uiresource/(Tiltfile)' --timeout=2m
          # A resource with auto_init=False (trigger modes 2 and 3), like the Playwright UI, never gets ready on its own.
          resources=$(tilt get uiresource -o json |
            jq -r '.items[] | select(.status.triggerMode // 0 | IN(2, 3) | not) | "uiresource/" + .metadata.name')
          # shellcheck disable=SC2086
          tilt wait --for=condition=Ready $resources --timeout=5m

      - name: e2e
        run: pnpm test:e2e

      - name: o11y check-live
        working-directory: backend
        run: make o11y.check-live

      - name: Tilt logs
        if: failure()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/tilt-logs"
          cp "$RUNNER_TEMP/tilt-up.log" "$RUNNER_TEMP/tilt-logs/" || true
          tilt get uiresource > "$RUNNER_TEMP/tilt-logs/uiresources.txt" 2>&1 || true
          tilt logs 2>&1 | tee "$RUNNER_TEMP/tilt-logs/tilt.log" || true

      - name: Upload Tilt logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tilt-logs
          path: ${{ runner.temp }}/tilt-logs/
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/apps/web/playwright-report/
          retention-days: 7

      - name: tilt down
        if: always()
        working-directory: .
        run: tilt down || true

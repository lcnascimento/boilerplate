name: ci-e2e

# Playwright against the real stack: a production build of the web app plus
# each backend service's binary (started by the Playwright webServer list).
on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/ci-e2e.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/ci-e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @boilerplate/web exec playwright install --with-deps chromium

      - name: e2e
        run: pnpm turbo run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/apps/web/playwright-report/
          retention-days: 7
